<!doctype html>
<html lang="{{ site.lang | default: 'ko' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:title" content="{{ page.title | escape }} | {{ site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <title>{{ page.title | escape }} | {{ site.title | escape }}</title>
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/content.css' | relative_url }}">
  {% feed_meta %}
  <script src="{{ '/app.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 이동</a>
  {{ content }}
</body>
</html>
